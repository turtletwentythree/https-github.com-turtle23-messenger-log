name: Sync Messenger booking data

on:
  schedule:
    # Every 5 minutes, all day (the shortest interval GitHub allows for
    # scheduled workflows) — cron is UTC. Adjust if you want a different
    # cadence (e.g. "*/30 0-12 * * 1-6" = every 30 min, 07:00-19:00 Bangkok
    # time, Mon-Sat). GitHub may delay scheduled runs by a few minutes
    # during high load; that's normal, and the web page's own "sync now"
    # button / auto-refresh-on-open don't depend on this cadence anyway.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # adds a "Run workflow" button for on-demand refresh

permissions:
  contents: write

concurrency:
  group: messenger-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch from SharePoint and rebuild docs/
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SHAREPOINT_FILE_URL: ${{ secrets.SHAREPOINT_FILE_URL }}
          SHAREPOINT_TEMPLATE_URL: ${{ secrets.SHAREPOINT_TEMPLATE_URL }}
        run: python scripts/sync_data.py

      - name: Commit and push if changed
        run: |
          git config user.name "messenger-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/index.html docs/booking_data.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "chore: sync booking data ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
